<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Без чехлов — каталог</title>
  <meta name="description" content="Машины в продаже — Без чехлов">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <header class="top">
    <h1 class="title">Сейчас в продаже</h1>
    <nav class="filters" id="filters" aria-label="Фильтр по цене"></nav>
  </header>

  <main>
    <p class="state" id="state">Загружаю…</p>
    <div class="grid" id="grid"></div>
  </main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="car-title">
      <button class="close" id="close" type="button" aria-label="Закрыть">✕</button>
      <div class="gallery-wrap">
        <div class="gallery" id="gallery"></div>
        <div class="counter" id="counter"></div>
      </div>
      <div class="card-body">
        <div class="badge" id="car-badge" hidden>Забронирована</div>
        <h2 id="car-title"></h2>
        <div class="price" id="car-price"></div>
        <dl class="facts" id="car-facts"></dl>
        <p class="desc" id="car-desc"></p>
        <a class="post-link" id="car-link" target="_blank" rel="noopener">📸 Пост в канале</a>
      </div>
      <div class="actions">
        <button class="btn-primary" id="contact" type="button">Написать продавцу</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=1"></script>
</body>
</html>
